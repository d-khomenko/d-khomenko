name: GitHub-Profile-3D-Contrib

on:
  schedule:
    # 04:17 Kyiv during daylight-saving time; off the busy top-of-hour window.
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-3d-contrib
  cancel-in-progress: false

jobs:
  build:
    runs-on: [self-hosted, Linux, ARM64, profile-3d-local]
    timeout-minutes: 15
    name: Generate GitHub profile 3D contribution graph
    steps:
      - uses: actions/checkout@v5

      - name: Generate contribution graphs
        uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit and push generated SVGs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add profile-3d-contrib/
          if git diff --cached --quiet; then
            echo "Contribution graphs are already current."
          else
            git commit -m "chore: update 3D contribution graph"
            git push origin HEAD:${{ github.ref_name }}
          fi
